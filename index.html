<style>

}
const LEG={},hasId=i=>i.id!=null&&i.id!=="",keyOf=i=>hasId(i)?"id:"+i.id:String(i.src||"").trim();
function ingest(d){
  Object.keys(LEG).forEach(k=>delete LEG[k]);HLSF.clear();
  d=d.filter(i=>i&&(i.src||hasId(i)));
  d.forEach(i=>{const k=keyOf(i);if(hasId(i)&&i.src)LEG[k]=String(i.src).trim();if(/^(hls|m3u8)$/i.test(String(i.tipe||i.type||i.format||"").trim()))HLSF.add(k)});
  D=d.map((i,n)=>({id:n,rid:hasId(i)?i.id:null,cat:String(i.kategori||"anime").toLowerCase().trim(),title:String(i.judul||"").trim(),
    eps:(i.eps&&!isNaN(i.eps))?"Eps "+i.eps:String(i.eps||"").trim(),src:keyOf(i),thumb:String(i.thumb||"").trim()}));
  GM=Object.create(null);SM=Object.create(null);GL=[];
  D.forEach(i=>{SM[i.src]=i.id;let g=GM[i.title];
    if(!g){g=GM[i.title]={gi:GL.length,title:i.title,cat:i.cat,thumb:i.thumb,eps:[]};GL.push(g)}
    if(!g.thumb&&i.thumb)g.thumb=i.thumb;g.eps.push(i)});
  GL.forEach(g=>g.eps.sort((a,b)=>num(a.eps)-num(b.eps)));
  updHot();
  try{const L=LS("lesehan_continue",[]),F=L.filter(c=>SM[c.src]!=null);if(F.length!==L.length)SV("lesehan_continue",F)}catch(e){}
}
function load(){
  try{localStorage.removeItem("lesehan_cache")}catch(e){}
  const raw=(()=>{try{return localStorage.getItem("lesehan_cache2")}catch(e){return null}})();
  let shown=0;
  if(raw&&!D.length){try{const c=JSON.parse(raw);if(Array.isArray(c)&&c.length){ingest(c);render(1);shown=1}}catch(e){}}
  if(!shown)$("main").innerHTML=tab==="profile"?rProf():skel();
  setTimeout(()=>{if(!window.VC){window.VC={};if(tab==="popular"&&D.length)render()}},8000);
  const c=new AbortController(),t=setTimeout(()=>c.abort(),15000);
  fetch(API,{signal:c.signal}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
    clearTimeout(t);if(!Array.isArray(d))throw 0;
    const str=JSON.stringify(d);
    try{localStorage.setItem("lesehan_cache2",str)}catch(e){}
    if(shown&&str===raw)return;
    if(ov.length&&D.length)return;
    ingest(d);render(shown?0:1);
  }).catch(()=>{clearTimeout(t);
    if(shown){toast("Gagal memperbarui, memakai data tersimpan");return}
    $("main").innerHTML='<div class="msg">'+(navigator.onLine?"Gagal mengambil data. Periksa koneksi lalu coba lagi.":"Kamu sedang offline. Periksa koneksi internet.")+'<br><br><button class="btn" onclick="load()">⟳ Muat Ulang</button></div>'});
}
const popular=()=>GL.map(g=>({g,v:views(g.title)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,30).map(x=>x.g);
window.onViews=()=>{
  if(!D.length)return;

};

function upCw(src,t,d,f){

    const g=GM[b.title],i=g?g.eps.findIndex(e=>e.id===b.id):-1,nx=i>=0?g.eps[i+1]:null;

/* iklan video sebelum putar (pre-roll) */
let noPre=0,preT=0;
function preOk(){

function preroll(src,done){
  const ad=PREROLL[Math.floor(Math.random()*PREROLL.length)],p=$("pl"),sk=ad.skip>0?ad.skip:5;let fin=0;
  const end=()=>{
    if(fin)return;fin=1;clearInterval(preT);

  const v=$("adv"),b=$("adsk");
  v.onended=end;v.onerror=end;
  if(ad.link)v.onclick=()=>window.open(ad.link,"_blank");
  v.play().catch(()=>{v.muted=true;v.play().catch(end)});
  setTimeout(()=>{if(!fin&&$("adv")===v&&v.currentTime===0)end()},8000);
  clearInterval(preT);

    if($("adv")!==v){clearInterval(preT);return}
    const r=Math.ceil(sk-v.currentTime);
    if(r>0){b.textContent="Lewati dalam "+r}

}

function playUrl(src,url){

        v.onended=()=>{upCw(src,v.duration,v.duration,1);if(sleepV==="ep"){clearSleep();updL();toast("Pewaktu tidur: episode selesai");return}autoNext()};
    if(window.Hls&&Hls.isSupported()){

        if(!d||!d.fatal)return;
        if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&rt<3){rt++;toast("Koneksi terganggu, mencoba lagi ("+rt+"/3)...");setTimeout(()=>{try{h.startLoad()}catch(x){}},1000*rt)}
        else if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&rt<3){rt++;try{h.recoverMediaError()}catch(x){}}
        else{try{h.destroy()}catch(x){}if(hls===h)hls=null;perr("Link video bermasalah atau koneksi terputus.",src)}
      });

function dtap(e){

  if(e.target.closest&&e.target.closest(".vc,.po"))return;
  const pl=$("pl"),r=pl.getBoundingClientRect(),t=e.changedTouches[0],x=(t.clientX-r.left)/r.width,y=t.clientY-r.top;
  if(y>r.height-56){tapT=0;return}
  const side=x<.4?-1:x>.6?1:0;if(!side){tapT=0;return}
  const n=Date.now();
  if(n-tapT<320&&side===tapS){
    tapN++;const d=isFinite(v.duration)?v.duration:1e9;
    v.currentTime=Math.max(0,Math.min(d,v.currentTime+side*10));
    pl.querySelectorAll(".dtf").forEach(z=>z.remove());
    const f=document.createElement("div");f.className="dtf "+(side<0?"l":"r");f.textContent=(side<0?"⏪ ":"⏩ ")+(tapN*10)+" dtk";pl.appendChild(f);
    setTimeout(()=>f.remove(),700);
  }else tapN=0;
  tapT=n;tapS=side;
}
