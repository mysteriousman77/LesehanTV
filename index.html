<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* logo: header = ikon saja (zoom), profil = logo penuh */

let noPre=0,preT=0;

function preroll(src,done){
  const ad=PREROLL[Math.floor(Math.random()*PREROLL.length)],p=$("pl"),sk=ad.skip>0?ad.skip:5;let fin=0;
  const end=()=>{

function playUrl(src,url){
